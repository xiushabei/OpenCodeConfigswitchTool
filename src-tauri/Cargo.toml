[package]
name = "omo-config-switcher"
version = "0.8.0"
description = "Windows preset switcher for OpenCode configuration files"
edition = "2021"
rust-version = "1.77"
publish = false

[lib]
name = "switcher_core"
path = "src/lib.rs"

[[bin]]
name = "omo-config-switcher"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
tauri = { version = "2", features = [] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
